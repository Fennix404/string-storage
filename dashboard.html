<!DOCTYPE html>
<html>
<head>
	<title>Ghosty's Superb String Storage</title>
	<link rel="stylesheet" type="text/css" href="sauce.css">
    <link rel="icon" type="image/png" href="ghost-favi.png">
	<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Lilita+One&family=Ojuju:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Average+Sans&family=Freckle+Face&family=Jolly+Lodger&family=Shadows+Into+Light+Two&display=swap" rel="stylesheet">
</head>
<body style = "background-color: #e9ebeb">

<div id="mainbox">
	<h1 id = "title"> Dashboard </h1>

	<p id = "status"> - </p>

	<div id="stringsbox">
		<p>
			<img src="defaultpfp.jpg" id="pfp" width="100" height="100"></img>
			Your Strings: 
		</p>
		<hr>
		<p id = "strings"> - </p>
	</div>

	<form id = "newStringForm">
		<p>
			Add a new string here! <input type = "text" id = "newString">
			<button type="button" id="addStringButton" onclick="addString()"> Add String </button>
			<button type="button" id = "masterDelete" onclick="toggleDeleteMode()"> Delete Strings </button>
		</p>
	</form>
	    
	<div id="button-wrapperB">
        <p><span>v1.0.1</span></p>

		<a href="./profile"><button> Profile </button></a>
		<button type="button" id="logoutButton" onclick="logout()"> Log Out </button>
    </div>
</div>

<script src="scriptDashboard.js"></script>

</body>
</html>
